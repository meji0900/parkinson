[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib", "../node_modules"]
solc_version = "0.8.30"
# Robinhood Chain runs ArbOS 61, which has every Cancun opcode
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# OpenZeppelin comes from npm (a root devDependency), forge-std is the one git submodule
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

# Official public endpoints (rate-limited). Where an ISP blocks *.robinhood.com, the dRPC ones answer the same chains.
[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet_drpc = "https://robinhood-testnet.drpc.org"
robinhood_drpc = "https://robinhood.drpc.org"
